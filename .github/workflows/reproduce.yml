name: Reproduce portfolio analyses
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python run.py all
      - run: python scripts/sql_audit.py
      - run: python -m unittest discover -s tests -v
      - run: python build.py
      - uses: actions/upload-artifact@v4
        with:
          name: verified-portfolio
          path: |
            reports/
            dist/
